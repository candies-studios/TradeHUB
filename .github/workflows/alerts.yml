# Watches every instrument in config.py and sends a Telegram alert when a strategy fires.
# GitHub's 5-minute scheduler is unreliable, so instead each run stays on for up to ~6 hours
# and checks every 5 minutes by itself. GitHub only needs to START a run a few times a day;
# extra starts simply wait in line. NSE/BSE 09:15-15:30 IST, MCX 09:00-23:30 IST.
# Needs TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID under Settings > Secrets and variables > Actions.
# To start watching right now: Actions > RSI alerts > Run workflow.
name: RSI alerts

on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * 1-5"    # 08:55 IST
    - cron: "40 4 * * 1-5"    # 10:10 IST (backup start)
    - cron: "25 6 * * 1-5"    # 11:55 IST
    - cron: "25 9 * * 1-5"    # 14:55 IST
    - cron: "25 12 * * 1-5"   # 17:55 IST
    - cron: "25 15 * * 1-5"   # 20:55 IST

permissions:
  contents: write

concurrency:
  group: rsi-alerts
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Remember what was already alerted
        uses: actions/cache/restore@v4
        with:
          path: .alert_state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-
      - name: Set up saving alerts to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Watch the market (checks every 5 minutes)
        run: python -u live_alerts.py --watch 345
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .alert_state.json
          key: alert-state-${{ github.run_id }}
